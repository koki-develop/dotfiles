onboarding = false

[theme]
name = "terminal"

[keys]
prefix = "ctrl+q"

[ui]
copy_on_select = false
tab_bar_right = [
  { type = "datetime", format = "%Y-%m-%d %H:%M" },
]

[ui.toast]
delivery = "terminal"

[experimental]
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["claude", "codex"]
switch_ascii_input_source_in_prefix = true
